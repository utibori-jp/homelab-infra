---
# Run with the auth key in the environment:
#   TS_AUTHKEY=tskey-auth-... ansible-playbook playbooks/exit-node.yaml
- name: Set up the Tailscale exit node
  hosts: exit_node
  become: true
  vars:
    ts_hostname: exit-node
  tasks:
    - name: Enable IP forwarding
      copy:
        dest: /etc/sysctl.d/99-tailscale.conf
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
        mode: "0644"
      register: sysctl_conf

    - name: Apply sysctl
      command: sysctl --system
      when: sysctl_conf.changed

    - name: Install prerequisites
      apt:
        name: [curl, ca-certificates]
        update_cache: true

    - name: Add Tailscale signing key
      get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add Tailscale repository
      copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        content: |
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
        mode: "0644"

    - name: Install Tailscale
      apt:
        name: tailscale
        update_cache: true

    - name: Check whether Tailscale is already logged in
      command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false

    - name: Bring Tailscale up as an exit node
      command: >-
        tailscale up
        --authkey={{ lookup('env', 'TS_AUTHKEY') }}
        --hostname={{ ts_hostname }}
        --advertise-exit-node
      no_log: true
      when: >-
        ts_status.rc != 0
        or (ts_status.stdout | from_json).BackendState != 'Running'
