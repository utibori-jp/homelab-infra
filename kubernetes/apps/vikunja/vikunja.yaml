apiVersion: v1
kind: Namespace
metadata:
  name: vikunja
---
apiVersion: v1
kind: Secret
metadata:
  name: vikunja-secrets
  namespace: vikunja
type: Opaque
stringData:
  # Replace these with secure values in production
  POSTGRES_PASSWORD: "vikunja-secure-password"
  VIKUNJA_SERVICE_JWTSECRET: "generate-a-random-string-here-very-long"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-db-pvc
  namespace: vikunja
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vikunja-db
  namespace: vikunja
spec:
  serviceName: vikunja-db
  replicas: 1
  selector:
    matchLabels:
      app: vikunja-db
  template:
    metadata:
      labels:
        app: vikunja-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: vikunja
            - name: POSTGRES_DB
              value: vikunja
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vikunja-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja-db
  namespace: vikunja
spec:
  selector:
    app: vikunja-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
        - name: vikunja
          image: vikunja/vikunja:latest
          env:
            - name: VIKUNJA_DATABASE_TYPE
              value: "postgres"
            - name: VIKUNJA_DATABASE_HOST
              value: "vikunja-db"
            - name: VIKUNJA_DATABASE_USER
              value: "vikunja"
            - name: VIKUNJA_DATABASE_DATABASE
              value: "vikunja"
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: POSTGRES_PASSWORD
            - name: VIKUNJA_SERVICE_JWTSECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-secrets
                  key: VIKUNJA_SERVICE_JWTSECRET
            # The Public URL should be your Tailscale MagicDNS name if enabled, 
            # or the IP assigned by Tailscale.
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "http://vikunja" 
          ports:
            - containerPort: 3456
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
  annotations:
    # Use Tailscale to expose the service
    tailscale.com/expose: "true"
    tailscale.com/hostname: "vikunja"
spec:
  selector:
    app: vikunja
  # Using LoadBalancer type with Tailscale Operator automatically 
  # creates a node in your Tailnet.
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - port: 80
      targetPort: 3456
