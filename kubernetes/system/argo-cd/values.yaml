argo-cd:
  server:
    service:
      # Exposed via Tailscale Ingress (managed by homelab-services repo).
      # See: homelab-services/charts/tailscale-ingresses/templates/argocd-ingress.yaml
      type: ClusterIP
    extraArgs:
      # --insecure is required when SSL termination is handled by an external provider
      # (like Tailscale Ingress) or for simplified local access.
      - --insecure
